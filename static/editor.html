<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script Writer Pro — Workbench</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Courier New', Courier, monospace;
  background: #1a1a1a;
  color: #e8e8e8;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Top bar ── */
#topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: #111;
  border-bottom: 1px solid #333;
  flex-shrink: 0;
}

#topbar h1 {
  font-size: 14px;
  font-weight: normal;
  color: #aaa;
  letter-spacing: 0.05em;
}

#scene-label {
  font-size: 13px;
  color: #666;
}

#status-msg {
  margin-left: auto;
  font-size: 12px;
  color: #555;
}

/* ── Three-pane layout ── */
#workspace {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Left pane — scene navigator (stub for Task 28) */
#left-pane {
  width: 200px;
  background: #161616;
  border-right: 1px solid #2a2a2a;
  padding: 12px 8px;
  font-size: 12px;
  color: #555;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
}

#left-pane .pane-title {
  color: #444;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 10px;
  padding-bottom: 4px;
  border-bottom: 1px solid #2a2a2a;
}

/* Centre pane — Artie stub */
#centre-pane {
  width: 260px;
  background: #161616;
  border-right: 1px solid #2a2a2a;
  padding: 12px 8px;
  font-size: 12px;
  color: #555;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
}

/* Right pane — the workbench */
#right-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #1e1e1e;
  overflow: hidden;
}

/* ── Component toolbar ── */
#comp-toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: #181818;
  border-bottom: 1px solid #2a2a2a;
  flex-shrink: 0;
  flex-wrap: wrap;
}

#comp-toolbar label {
  font-size: 11px;
  color: #666;
  margin-right: 4px;
}

.comp-btn {
  padding: 4px 10px;
  font-size: 11px;
  font-family: inherit;
  background: #2a2a2a;
  color: #999;
  border: 1px solid #333;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
}

.comp-btn:hover { background: #333; color: #ccc; }

.comp-btn.active {
  background: #3a5a3a;
  color: #8de88d;
  border-color: #4a7a4a;
}

/* ── Script surface ── */
#script-surface {
  flex: 1;
  overflow-y: auto;
  padding: 32px 48px 64px;
}

/* each component block */
.comp-block {
  display: flex;
  align-items: flex-start;
  margin-bottom: 6px;
  gap: 0;
}

/* gutter label */
.comp-gutter {
  width: 120px;
  flex-shrink: 0;
  font-size: 10px;
  color: #444;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding-top: 4px;
  text-align: right;
  padding-right: 14px;
  user-select: none;
}

.comp-block.focused .comp-gutter {
  color: #5a8a5a;
}

/* the contenteditable line */
.comp-input {
  flex: 1;
  min-height: 24px;
  outline: none;
  border: none;
  background: transparent;
  color: #ddd;
  font-family: 'Courier New', Courier, monospace;
  font-size: 15px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  caret-color: #8de88d;
  padding: 2px 0;
  border-bottom: 1px solid transparent;
  transition: border-color 0.15s;
}

.comp-input:focus {
  border-bottom-color: #3a5a3a;
}

/* Fountain-style formatting per type */
.comp-block[data-type="SCENE_HEADING"] .comp-input {
  text-transform: uppercase;
  font-weight: bold;
  color: #fff;
  margin-top: 16px;
}
.comp-block[data-type="CHARACTER"] .comp-input {
  text-transform: uppercase;
  padding-left: 140px;
  color: #ddd;
  margin-top: 12px;
}
.comp-block[data-type="DIALOGUE"] .comp-input {
  padding-left: 60px;
  padding-right: 60px;
  color: #ccc;
}
.comp-block[data-type="PARENTHETICAL"] .comp-input {
  padding-left: 100px;
  padding-right: 100px;
  color: #999;
  font-style: italic;
}
.comp-block[data-type="TRANSITION"] .comp-input {
  text-transform: uppercase;
  text-align: right;
  color: #bbb;
  margin-top: 12px;
}
.comp-block[data-type="NOTE"] .comp-input {
  color: #666;
  font-style: italic;
  border-bottom-color: #333;
}
.comp-block[data-type="ACTION"] .comp-input {
  color: #ddd;
}

/* ── Add-component button ── */
#add-comp-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px 8px 136px;
  border-top: 1px solid #2a2a2a;
  flex-shrink: 0;
}

#add-comp-bar button {
  padding: 5px 14px;
  font-size: 12px;
  font-family: inherit;
  background: #252525;
  color: #777;
  border: 1px solid #333;
  border-radius: 3px;
  cursor: pointer;
}
#add-comp-bar button:hover { background: #2e2e2e; color: #aaa; }

/* ── Init screen ── */
#init-screen {
  position: fixed;
  inset: 0;
  background: #1a1a1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 100;
}

#init-screen h2 {
  font-size: 16px;
  font-weight: normal;
  color: #aaa;
}

.init-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 360px;
}

.init-field label {
  font-size: 12px;
  color: #666;
}

.init-field input {
  background: #222;
  border: 1px solid #333;
  border-radius: 3px;
  color: #ddd;
  font-family: inherit;
  font-size: 14px;
  padding: 8px 10px;
  outline: none;
}
.init-field input:focus { border-color: #4a7a4a; }

#init-screen button {
  padding: 8px 24px;
  background: #3a5a3a;
  color: #8de88d;
  border: 1px solid #4a7a4a;
  border-radius: 3px;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
}
#init-screen button:hover { background: #405f40; }

.init-hint {
  font-size: 11px;
  color: #444;
  max-width: 360px;
  text-align: center;
  line-height: 1.5;
}
</style>
</head>
<body>

<!-- ── Init screen: enter or generate scene/take IDs ── -->
<div id="init-screen">
  <h2>Script Writer Pro — Workbench</h2>
  <div class="init-field">
    <label>Scene ID (UUID)</label>
    <input type="text" id="input-scene-id" placeholder="leave blank to auto-generate">
  </div>
  <div class="init-field">
    <label>Take ID (UUID — leave blank to create a new take)</label>
    <input type="text" id="input-take-id" placeholder="leave blank to create a new take">
  </div>
  <button id="btn-open">Open Workbench</button>
  <p class="init-hint">
    This surface is the writer's workbench only.<br>
    Nothing generated ever appears here.
  </p>
</div>

<!-- ── Main layout ── -->
<div id="topbar">
  <h1>SCRIPT WRITER PRO</h1>
  <span id="scene-label">—</span>
  <span id="status-msg">ready</span>
</div>

<div id="workspace">
  <!-- Left: scene navigator stub -->
  <div id="left-pane">
    <div class="pane-title">Navigator</div>
    <span style="color:#333">(Task 29+)</span>
  </div>

  <!-- Centre: Artie stub -->
  <div id="centre-pane">
    <div class="pane-title">Artie</div>
    <span style="color:#333">(Task 29+)</span>
  </div>

  <!-- Right: the workbench -->
  <div id="right-pane">
    <div id="comp-toolbar">
      <label>Component:</label>
      <!-- Seven types per docs/14_editor.md §2 -->
      <button class="comp-btn active" data-type="ACTION">Action</button>
      <button class="comp-btn" data-type="SCENE_HEADING">Scene Heading</button>
      <button class="comp-btn" data-type="CHARACTER">Character</button>
      <button class="comp-btn" data-type="DIALOGUE">Dialogue</button>
      <button class="comp-btn" data-type="PARENTHETICAL">Parenthetical</button>
      <button class="comp-btn" data-type="TRANSITION">Transition</button>
      <button class="comp-btn" data-type="NOTE">Note</button>
    </div>

    <div id="script-surface"></div>

    <div id="add-comp-bar">
      <button id="btn-add-comp">+ Add Component</button>
      <button id="btn-export">Export Fountain</button>
    </div>
  </div>
</div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let sceneId = null;
let takeId = null;
let currentType = "ACTION";

// component_id → { el, type, content }
const components = new Map();

// Ordered list of component_ids (sequence_order = index + 1)
const order = [];

// Autosave state
let saveTimer = null;
const SAVE_IDLE_MS = 2000;
const SAVE_CHAR_THRESHOLD = 200;
let charsSinceLastSave = 0;

// ---------------------------------------------------------------------------
// Init screen
// ---------------------------------------------------------------------------
document.getElementById("btn-open").addEventListener("click", async () => {
  const rawScene = document.getElementById("input-scene-id").value.trim();
  const rawTake  = document.getElementById("input-take-id").value.trim();

  sceneId = rawScene || crypto.randomUUID();

  if (rawTake) {
    takeId = rawTake;
    // Load existing components
    setStatus("loading…");
    await loadComponents();
  } else {
    // Create a new take for this scene
    setStatus("creating take…");
    const res = await fetch(`/scene/${sceneId}/takes`, { method: "POST" });
    if (!res.ok) {
      setStatus(`error creating take: ${res.status}`);
      return;
    }
    const data = await res.json();
    takeId = data.take_id;
    setStatus(`take ${data.take_number} created`);
  }

  document.getElementById("scene-label").textContent =
    `scene ${sceneId.slice(0,8)}… / take ${takeId.slice(0,8)}…`;
  document.getElementById("init-screen").style.display = "none";
});

// ---------------------------------------------------------------------------
// Component type toolbar
// ---------------------------------------------------------------------------
document.querySelectorAll(".comp-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentType = btn.dataset.type;
    setActiveTypeBtn(currentType);
  });
});

function setActiveTypeBtn(type) {
  document.querySelectorAll(".comp-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.type === type);
  });
}

// ---------------------------------------------------------------------------
// Add component
// ---------------------------------------------------------------------------
document.getElementById("btn-add-comp").addEventListener("click", () => {
  addComponentToSurface({ comp_type: currentType, content: "", component_id: null });
});

function addComponentToSurface({ comp_type, content, component_id }) {
  const surface = document.getElementById("script-surface");

  const block = document.createElement("div");
  block.className = "comp-block";
  block.dataset.type = comp_type;
  if (component_id) block.dataset.componentId = component_id;

  const gutter = document.createElement("div");
  gutter.className = "comp-gutter";
  gutter.textContent = labelFor(comp_type);

  const input = document.createElement("div");
  input.className = "comp-input";
  input.contentEditable = "true";
  input.spellcheck = true;
  input.dataset.componentId = component_id || "";
  // Prevent paste of rich text — always paste plain text
  input.addEventListener("paste", e => {
    e.preventDefault();
    const text = e.clipboardData.getData("text/plain");
    document.execCommand("insertText", false, text);
  });

  if (content) input.textContent = content;

  block.appendChild(gutter);
  block.appendChild(input);
  surface.appendChild(block);

  // Track order
  if (component_id) {
    order.push(component_id);
    components.set(component_id, { block, input, type: comp_type, content });
  } else {
    // New unsaved component — assign a temporary id
    const tmpId = "tmp-" + crypto.randomUUID();
    block.dataset.componentId = tmpId;
    input.dataset.componentId = tmpId;
    order.push(tmpId);
    components.set(tmpId, { block, input, type: comp_type, content: "", tmpId });
  }

  // Focus and gutter highlight
  input.addEventListener("focus", () => {
    block.classList.add("focused");
    currentType = comp_type;
    setActiveTypeBtn(comp_type);
  });
  input.addEventListener("blur", () => {
    block.classList.remove("focused");
    scheduleSave(block);
  });
  input.addEventListener("input", () => {
    charsSinceLastSave += 1;
    if (charsSinceLastSave >= SAVE_CHAR_THRESHOLD) {
      saveComponent(block);
    } else {
      scheduleSave(block);
    }
  });

  input.focus();
  return block;
}

function labelFor(type) {
  const labels = {
    SCENE_HEADING: "SCENE HDG",
    ACTION: "ACTION",
    CHARACTER: "CHARACTER",
    DIALOGUE: "DIALOGUE",
    PARENTHETICAL: "PARENT.",
    TRANSITION: "TRANSITION",
    NOTE: "NOTE",
  };
  return labels[type] || type;
}

// ---------------------------------------------------------------------------
// Load existing components from the backend
// ---------------------------------------------------------------------------
async function loadComponents() {
  const res = await fetch(`/takes/${takeId}/components`);
  if (!res.ok) { setStatus("error loading components"); return; }
  const data = await res.json();
  data.forEach(c => addComponentToSurface({
    comp_type: c.comp_type,
    content: c.content,
    component_id: c.component_id,
  }));
  setStatus(`loaded ${data.length} component(s)`);
}

// ---------------------------------------------------------------------------
// Autosave
// ---------------------------------------------------------------------------
function scheduleSave(block) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveComponent(block), SAVE_IDLE_MS);
}

async function saveComponent(block) {
  clearTimeout(saveTimer);
  charsSinceLastSave = 0;

  const input = block.querySelector(".comp-input");
  const content = input.textContent;
  const compType = block.dataset.type;
  const cid = block.dataset.componentId;

  if (cid && !cid.startsWith("tmp-")) {
    // Update existing component
    const res = await fetch(`/components/${cid}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content, comp_type: compType }),
    });
    if (!res.ok) setStatus(`save error ${res.status}`);
    else setStatus("saved");
  } else {
    // Create new component
    const seq = order.indexOf(cid) + 1;
    const res = await fetch(`/takes/${takeId}/components`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ comp_type: compType, content, sequence_order: seq }),
    });
    if (!res.ok) { setStatus(`save error ${res.status}`); return; }
    const data = await res.json();
    // Upgrade from tmp id to real id
    const idx = order.indexOf(cid);
    if (idx !== -1) order[idx] = data.component_id;
    const entry = components.get(cid);
    components.delete(cid);
    components.set(data.component_id, { ...entry, content });
    block.dataset.componentId = data.component_id;
    input.dataset.componentId = data.component_id;
    setStatus("saved");
  }
}

// ---------------------------------------------------------------------------
// Export Fountain
// ---------------------------------------------------------------------------
document.getElementById("btn-export").addEventListener("click", async () => {
  if (!takeId) return;
  const res = await fetch(`/takes/${takeId}/fountain`);
  if (!res.ok) { setStatus("export error"); return; }
  const text = await res.text();
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `take-${takeId.slice(0,8)}.fountain`;
  a.click();
  URL.revokeObjectURL(url);
  setStatus("exported");
});

// ---------------------------------------------------------------------------
// Utility
// ---------------------------------------------------------------------------
function setStatus(msg) {
  document.getElementById("status-msg").textContent = msg;
}
</script>
</body>
</html>
