<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script Writer Pro — Workbench</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Courier New', Courier, monospace;
  background: #1a1a1a;
  color: #e8e8e8;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Top bar ── */
#topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: #111;
  border-bottom: 1px solid #333;
  flex-shrink: 0;
}

#topbar h1 {
  font-size: 14px;
  font-weight: normal;
  color: #aaa;
  letter-spacing: 0.05em;
}

#scene-label {
  font-size: 13px;
  color: #666;
}

#status-msg {
  margin-left: auto;
  font-size: 12px;
  color: #555;
}

/* ── Three-pane layout ── */
#workspace {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Left pane — scene navigator (stub for Task 28) */
#left-pane {
  width: 200px;
  background: #161616;
  border-right: 1px solid #2a2a2a;
  padding: 12px 8px;
  font-size: 12px;
  color: #555;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
}

#left-pane .pane-title {
  color: #444;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 10px;
  padding-bottom: 4px;
  border-bottom: 1px solid #2a2a2a;
}

/* Centre pane — Artie stub */
#centre-pane {
  width: 260px;
  background: #161616;
  border-right: 1px solid #2a2a2a;
  padding: 12px 8px;
  font-size: 12px;
  color: #555;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
}

/* Right pane — the workbench */
#right-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #1e1e1e;
  overflow: hidden;
}

/* ── Component toolbar ── */
#comp-toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: #181818;
  border-bottom: 1px solid #2a2a2a;
  flex-shrink: 0;
  flex-wrap: wrap;
}

#comp-toolbar.collapsed {
  display: none;
}

#instructional-note {
  font-size: 11px;
  color: #666;
  padding: 6px 16px;
  background: #181818;
  border-bottom: 1px solid #2a2a2a;
}

#instructional-note a {
  color: #8de88d;
  text-decoration: none;
}

#comp-toolbar label {
  font-size: 11px;
  color: #666;
  margin-right: 4px;
}

.comp-btn {
  padding: 4px 10px;
  font-size: 11px;
  font-family: inherit;
  background: #2a2a2a;
  color: #999;
  border: 1px solid #333;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
}

.comp-btn:hover { background: #333; color: #ccc; }

.comp-btn.active {
  background: #3a5a3a;
  color: #8de88d;
  border-color: #4a7a4a;
}

/* ── Script surface ── */
#script-surface {
  flex: 1;
  overflow-y: auto;
  padding: 32px 48px 64px;
}

/* each component block */
.comp-block {
  display: flex;
  align-items: flex-start;
  margin-bottom: 6px;
  gap: 0;
}

/* gutter label */
.comp-gutter {
  width: 120px;
  flex-shrink: 0;
  font-size: 10px;
  color: #444;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding-top: 4px;
  text-align: right;
  padding-right: 14px;
  user-select: none;
}

.comp-block.focused .comp-gutter {
  color: #5a8a5a;
}

/* the contenteditable line */
.comp-input {
  flex: 1;
  min-height: 24px;
  outline: none;
  border: none;
  background: transparent;
  color: #ddd;
  font-family: 'Courier New', Courier, monospace;
  font-size: 15px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  caret-color: #8de88d;
  padding: 2px 0;
  border-bottom: 1px solid transparent;
  transition: border-color 0.15s;
}

.comp-input:focus {
  border-bottom-color: #3a5a3a;
}

/* Fountain-style formatting per type */
.comp-block[data-type="SCENE_HEADING"] .comp-input {
  text-transform: uppercase;
  font-weight: bold;
  color: #fff;
  margin-top: 16px;
}
.comp-block[data-type="CHARACTER"] .comp-input {
  text-transform: uppercase;
  padding-left: 140px;
  color: #ddd;
  margin-top: 12px;
}
.comp-block[data-type="DIALOGUE"] .comp-input {
  padding-left: 60px;
  padding-right: 60px;
  color: #ccc;
}
.comp-block[data-type="PARENTHETICAL"] .comp-input {
  padding-left: 100px;
  padding-right: 100px;
  color: #999;
  font-style: italic;
}
.comp-block[data-type="TRANSITION"] .comp-input {
  text-transform: uppercase;
  text-align: right;
  color: #bbb;
  margin-top: 12px;
}
.comp-block[data-type="NOTE"] .comp-input {
  color: #666;
  font-style: italic;
  border-bottom-color: #333;
}
.comp-block[data-type="ACTION"] .comp-input {
  color: #ddd;
}

/* ── Add-component button ── */
#add-comp-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px 8px 136px;
  border-top: 1px solid #2a2a2a;
  flex-shrink: 0;
}

#add-comp-bar button {
  padding: 5px 14px;
  font-size: 12px;
  font-family: inherit;
  background: #252525;
  color: #777;
  border: 1px solid #333;
  border-radius: 3px;
  cursor: pointer;
}
#add-comp-bar button:hover { background: #2e2e2e; color: #aaa; }

/* ── Init screen ── */
#init-screen {
  position: fixed;
  inset: 0;
  background: #1a1a1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 100;
}

#init-screen h2 {
  font-size: 16px;
  font-weight: normal;
  color: #aaa;
}

.init-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 360px;
}

.init-field label {
  font-size: 12px;
  color: #666;
}

.init-field input {
  background: #222;
  border: 1px solid #333;
  border-radius: 3px;
  color: #ddd;
  font-family: inherit;
  font-size: 14px;
  padding: 8px 10px;
  outline: none;
}
.init-field input:focus { border-color: #4a7a4a; }

#init-screen button {
  padding: 8px 24px;
  background: #3a5a3a;
  color: #8de88d;
  border: 1px solid #4a7a4a;
  border-radius: 3px;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
}
#init-screen button:hover { background: #405f40; }

.init-hint {
  font-size: 11px;
  color: #444;
  max-width: 360px;
  text-align: center;
  line-height: 1.5;
}
</style>
</head>
<body>

<!-- ── Init screen: enter or generate scene/take IDs ── -->
<div id="init-screen">
  <h2>Script Writer Pro — Workbench</h2>
  <div class="init-field">
    <label>Scene ID (UUID)</label>
    <input type="text" id="input-scene-id" placeholder="leave blank to auto-generate">
  </div>
  <div class="init-field">
    <label>Take ID (UUID — leave blank to create a new take)</label>
    <input type="text" id="input-take-id" placeholder="leave blank to create a new take">
  </div>
  <button id="btn-open">Open Workbench</button>
  <p class="init-hint">
    This surface is the writer's workbench only.<br>
    Nothing generated ever appears here.
  </p>
</div>

<!-- ── Main layout ── -->
<div id="topbar">
  <h1>SCRIPT WRITER PRO</h1>
  <span id="scene-label">—</span>
  <span id="status-msg">ready</span>
</div>

<div id="workspace">
  <!-- Left: scene navigator stub -->
  <div id="left-pane">
    <div class="pane-title">Navigator</div>
    <span style="color:#333">(Task 29+)</span>
  </div>

  <!-- Centre: Artie stub -->
  <div id="centre-pane">
    <div class="pane-title">Artie</div>
    <span style="color:#333">(Task 29+)</span>
  </div>

  <!-- Right: the workbench -->
  <div id="right-pane">
    <div id="comp-toolbar">
      <label>Component:</label>
      <!-- Seven types per docs/14_editor.md §2 -->
      <button class="comp-btn active" data-type="ACTION">Action</button>
      <button class="comp-btn" data-type="SCENE_HEADING">Scene Heading</button>
      <button class="comp-btn" data-type="CHARACTER">Character</button>
      <button class="comp-btn" data-type="DIALOGUE">Dialogue</button>
      <button class="comp-btn" data-type="PARENTHETICAL">Parenthetical</button>
      <button class="comp-btn" data-type="TRANSITION">Transition</button>
      <button class="comp-btn" data-type="NOTE">Note</button>
    </div>

    <div id="script-surface"></div>

    <div id="add-comp-bar">
      <button id="btn-add-comp">+ Add Component</button>
      <button id="btn-export">Export Fountain</button>
    </div>
  </div>
</div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let sceneId = null;
let takeId = null;
let currentType = "ACTION";

// component_id → { el, type, content }
const components = new Map();

// Ordered list of component_ids (sequence_order = index + 1)
const order = [];

// Autosave state
let saveTimer = null;
const SAVE_IDLE_MS = 2000;
const SAVE_CHAR_THRESHOLD = 200;
let charsSinceLastSave = 0;

// Provenance state
const keystrokeBatch = {
  timer: null,
  startTime: null,
  charDelta: 0,
  componentId: null,
};
let lastKnownCopy = "";
const chainHashes = new Map(); // component_id -> hash


// ---------------------------------------------------------------------------
// Provenance Capture (docs/09_provenance_ledger.md §5, §6)
// ---------------------------------------------------------------------------

// --- Hashing ---
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', text2buf(str));
  return buf2hex(buf);
}
function buf2hex(buffer) {
  return [...new Uint8Array(buffer)]
      .map(x => x.toString(16).padStart(2, '0'))
      .join('');
}
function text2buf(str) {
  return new TextEncoder().encode(str);
}

// --- Event sending ---
async function sendProvenanceEvent(eventType, payload) {
  if (!sceneId) return;
  try {
    const res = await fetch("/events", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        event_type: eventType,
        scene_id: sceneId,
        payload: payload,
      }),
    });
    if (!res.ok) {
      const err = await res.json();
      setStatus(`event error: ${err.error || res.status}`);
    } else {
      setStatus(`${eventType.toLowerCase().replace(/_/g, " ")} sent`);
    }
  } catch (e) {
    setStatus(`event error: ${e.message}`);
  }
}

async function closeKeystrokeBatch(force = false) {
  if (!keystrokeBatch.startTime || !keystrokeBatch.componentId) return;

  clearTimeout(keystrokeBatch.timer);
  keystrokeBatch.timer = null;

  const cid = keystrokeBatch.componentId;
  const comp = components.get(cid);
  if (!comp) return;

  const content = comp.input.textContent;
  const contentHash = await sha256(content);
  const prevChainHash = chainHashes.get(cid) || await sha256(cid);
  const newChainHash = await sha256(prevChainHash + contentHash);

  const payload = {
    component_id: cid,
    ts_start_micros: keystrokeBatch.startTime,
    ts_end_micros: Date.now() * 1000,
    char_delta: keystrokeBatch.charDelta,
    chain_hash: newChainHash,
  };

  await sendProvenanceEvent("KEYSTROKE_BATCH", payload);

  chainHashes.set(cid, newChainHash);
  keystrokeBatch.startTime = null;
  keystrokeBatch.charDelta = 0;
  keystrokeBatch.componentId = null;
}

function handleKeystroke(e) {
  const input = e.target;
  const cid = input.dataset.componentId;
  if (!cid || cid.startsWith("tmp-")) return;

  // Different component, close previous batch
  if (keystrokeBatch.componentId && keystrokeBatch.componentId !== cid) {
    closeKeystrokeBatch(true);
  }

  if (!keystrokeBatch.startTime) {
    keystrokeBatch.startTime = Date.now() * 1000;
    keystrokeBatch.componentId = cid;
  }
  
  // This is an approximation. A more accurate char_delta would analyze
  // the specific change, but this matches the old `charsSinceLastSave`.
  keystrokeBatch.charDelta += 1;

  clearTimeout(keystrokeBatch.timer);
  keystrokeBatch.timer = setTimeout(() => closeKeystrokeBatch(), SAVE_IDLE_MS);

  if (keystrokeBatch.charDelta >= SAVE_CHAR_THRESHOLD) {
    closeKeystrokeBatch(true);
  }
}

function handleCopy(e) {
    const selection = document.getSelection();
    lastKnownCopy = selection.toString();
}

function handlePaste(e) {
    e.preventDefault();
    const text = e.clipboardData.getData("text/plain");
    document.execCommand("insertText", false, text);

    const cid = e.target.dataset.componentId;
    if (!cid || cid.startsWith("tmp-")) return;
    
    // Close any open keystroke batch before processing paste
    closeKeystrokeBatch(true);

    const origin = (text === lastKnownCopy) ? "INTERNAL" : "UNKNOWN";
    
    const payload = {
        origin: origin,
        char_count: text.length,
        target_component_id: cid,
    };
    sendProvenanceEvent("PASTE", payload);
}


// ---------------------------------------------------------------------------
// Init screen
// ---------------------------------------------------------------------------
document.getElementById("btn-open").addEventListener("click", async () => {
  const rawScene = document.getElementById("input-scene-id").value.trim();
  const rawTake  = document.getElementById("input-take-id").value.trim();

  sceneId = rawScene || crypto.randomUUID();

  if (rawTake) {
    takeId = rawTake;
    // Load existing components
    setStatus("loading…");
    await loadComponents();
  } else {
    // Create a new take for this scene
    setStatus("creating take…");
    const res = await fetch(`/scene/${sceneId}/takes`, { method: "POST" });
    if (!res.ok) {
      setStatus(`error creating take: ${res.status}`);
      return;
    }
    const data = await res.json();
    takeId = data.take_id;
    setStatus(`take ${data.take_number} created`);
  }

  document.getElementById("scene-label").textContent =
    `scene ${sceneId.slice(0,8)}… / take ${takeId.slice(0,8)}…`;
  document.getElementById("init-screen").style.display = "none";
});

// ---------------------------------------------------------------------------
// Component type toolbar
// ---------------------------------------------------------------------------
document.querySelectorAll(".comp-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentType = btn.dataset.type;
    setActiveTypeBtn(currentType);
  });
});

function setActiveTypeBtn(type) {
  document.querySelectorAll(".comp-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.type === type);
  });
}

// ---------------------------------------------------------------------------
// Add component
// ---------------------------------------------------------------------------
document.getElementById("btn-add-comp").addEventListener("click", () => {
  addComponentToSurface({ comp_type: currentType, content: "", component_id: null });
});

function addComponentToSurface({ comp_type, content, component_id }, afterBlock = null) {
  const surface = document.getElementById("script-surface");

  const block = document.createElement("div");
  block.className = "comp-block";
  block.dataset.type = comp_type;
  if (component_id) block.dataset.componentId = component_id;

  const gutter = document.createElement("div");
  gutter.className = "comp-gutter";
  gutter.textContent = labelFor(comp_type);

  const input = document.createElement("div");
  input.className = "comp-input";
  input.contentEditable = "true";
  input.spellcheck = true;
  input.dataset.componentId = component_id || "";
  input.addEventListener("paste", handlePaste);
  input.addEventListener("copy", handleCopy);

  if (content) input.textContent = content;

  block.appendChild(gutter);
  block.appendChild(input);
  
  if (afterBlock && afterBlock.nextSibling) {
    surface.insertBefore(block, afterBlock.nextSibling);
  } else {
    surface.appendChild(block);
  }

  // Track order
  let newId = component_id;
  if (!newId) {
    // New unsaved component — assign a temporary id
    newId = "tmp-" + crypto.randomUUID();
    block.dataset.componentId = newId;
    input.dataset.componentId = newId;
  }
  
  if (afterBlock) {
    const prevId = afterBlock.dataset.componentId;
    const idx = order.indexOf(prevId);
    if (idx !== -1) {
      order.splice(idx + 1, 0, newId);
    } else {
      order.push(newId);
    }
  } else {
    order.push(newId);
  }
  
  // Note: the old `saveComponent` function saved the initial state.
  // The new model saves on first keystroke, which is fine.
  components.set(newId, { block, input, type: comp_type, content: content || "", tmpId: component_id ? undefined : newId });

  // Focus and gutter highlight
  input.addEventListener("focus", () => {
    block.classList.add("focused");
    currentType = comp_type;
    setActiveTypeBtn(comp_type);
  });
  input.addEventListener("blur", () => {
    block.classList.remove("focused");
    // When focus is lost, force the current batch to close.
    closeKeystrokeBatch(true);
  });
  
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const content = input.textContent.trim();
      const currentType = block.dataset.type;
      
      if (content === "") {
        // Fall-through on empty
        const fallThrough = {
          SCENE_HEADING: "ACTION",
          ACTION: "SCENE_HEADING",
          CHARACTER: "ACTION",
          DIALOGUE: "ACTION",
          PARENTHETICAL: "ACTION",
          TRANSITION: "ACTION",
          NOTE: "ACTION"
        };
        changeComponentType(block, fallThrough[currentType]);
      } else {
        // Predictive advance
        const predict = {
          SCENE_HEADING: "ACTION",
          ACTION: "ACTION",
          CHARACTER: "DIALOGUE",
          DIALOGUE: "CHARACTER",
          PARENTHETICAL: "DIALOGUE",
          TRANSITION: "SCENE_HEADING",
          NOTE: "ACTION"
        };
        const nextType = predict[currentType] || "ACTION";
        // Ensure batch is closed before adding new component
        closeKeystrokeBatch(true);
        addComponentToSurface({ comp_type: nextType, content: "", component_id: null }, block);
      }
    } else if (e.key === "Tab") {
      e.preventDefault();
      // Manual cycle
      const cycle = {
        ACTION: "CHARACTER",
        CHARACTER: "PARENTHETICAL",
        PARENTHETICAL: "DIALOGUE",
        DIALOGUE: "TRANSITION",
        TRANSITION: "SCENE_HEADING",
        SCENE_HEADING: "ACTION",
        NOTE: "ACTION"
      };
      changeComponentType(block, cycle[block.dataset.type]);
      recordTabPress();
    }
  });

  input.addEventListener("input", (e) => {
    // Implicit patterns
    const text = input.textContent;
    const currentType = block.dataset.type;
    let newType = null;
    
    if (/^(INT\.|EXT\.|EST\.|I\/E)/i.test(text.trimStart()) && currentType !== "SCENE_HEADING") {
      newType = "SCENE_HEADING";
    } else if (text.startsWith("(") && currentType !== "PARENTHETICAL") {
      newType = "PARENTHETICAL";
    }

    if (newType) {
      changeComponentType(block, newType);
    }
    
    handleKeystroke(e);
  });

  input.focus();
  return block;
}

function changeComponentType(block, newType) {
  block.dataset.type = newType;
  const gutter = block.querySelector(".comp-gutter");
  gutter.textContent = labelFor(newType);
  
  const input = block.querySelector(".comp-input");
  currentType = newType;
  setActiveTypeBtn(newType);
  // A type change is a significant event, so we force the batch to close.
  // The component's content hasn't changed, but its type has. The backend
  // PUT /components/:id handles this, but we log the preceding text edits.
  closeKeystrokeBatch(true);
}

function labelFor(type) {
  const labels = {
    SCENE_HEADING: "SCENE HDG",
    ACTION: "ACTION",
    CHARACTER: "CHARACTER",
    DIALOGUE: "DIALOGUE",
    PARENTHETICAL: "PARENT.",
    TRANSITION: "TRANSITION",
    NOTE: "NOTE",
  };
  return labels[type] || type;
}

// ---------------------------------------------------------------------------
// Instructional Mode
// ---------------------------------------------------------------------------
let tabPresses = 0;
const TAB_COLLAPSE_THRESHOLD = 5;
let instructionalCollapsed = false;

function recordTabPress() {
  if (instructionalCollapsed) return;
  tabPresses++;
  if (tabPresses >= TAB_COLLAPSE_THRESHOLD) {
    collapseInstructionalMode();
  }
}

function collapseInstructionalMode() {
  instructionalCollapsed = true;
  const toolbar = document.getElementById("comp-toolbar");
  toolbar.classList.add("collapsed");
  // Show a one-line note
  let note = document.getElementById("instructional-note");
  if (!note) {
    note = document.createElement("div");
    note.id = "instructional-note";
    note.innerHTML = `Mode palette hidden. <a href="#" id="toggle-palette">Show palette</a>`;
    toolbar.parentNode.insertBefore(note, toolbar.nextSibling);
    document.getElementById("toggle-palette").addEventListener("click", (e) => {
      e.preventDefault();
      toolbar.classList.toggle("collapsed");
    });
  }
}

// ---------------------------------------------------------------------------
// Load existing components from the backend
// ---------------------------------------------------------------------------
async function loadComponents() {
  const res = await fetch(`/takes/${takeId}/components`);
  if (!res.ok) { setStatus("error loading components"); return; }
  const data = await res.json();
  data.forEach(c => addComponentToSurface({
    comp_type: c.comp_type,
    content: c.content,
    component_id: c.component_id,
  }));
  setStatus(`loaded ${data.length} component(s)`);
}

// ---------------------------------------------------------------------------
// Export Fountain
// ---------------------------------------------------------------------------
document.getElementById("btn-export").addEventListener("click", async () => {
  if (!takeId) return;
  const res = await fetch(`/takes/${takeId}/fountain`);
  if (!res.ok) { setStatus("export error"); return; }
  const text = await res.text();
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `take-${takeId.slice(0,8)}.fountain`;
  a.click();
  URL.revokeObjectURL(url);
  setStatus("exported");
});

// ---------------------------------------------------------------------------
// Utility
// ---------------------------------------------------------------------------
function setStatus(msg) {
  document.getElementById("status-msg").textContent = msg;
}
</script>
</body>
</html>
