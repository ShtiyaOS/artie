<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script Writer Pro — Workbench</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Courier New', Courier, monospace;
  background: #1a1a1a;
  color: #e8e8e8;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Top bar ── */
#topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: #111;
  border-bottom: 1px solid #333;
  flex-shrink: 0;
}

#topbar h1 {
  font-size: 14px;
  font-weight: normal;
  color: #aaa;
  letter-spacing: 0.05em;
}

#scene-label {
  font-size: 13px;
  color: #666;
}

#status-msg {
  margin-left: auto;
  font-size: 12px;
  color: #555;
}

/* ── Three-pane layout ── */
#workspace {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Left pane — scene navigator (stub for Task 28) */
#left-pane {
  width: 280px; /* Wider for heatmap */
  background: #161616;
  border-right: 1px solid #2a2a2a;
  padding: 12px 8px;
  font-size: 12px;
  color: #555;
  display: flex;
  flex-direction: column;
  gap: 18px; /* Increased gap */
  flex-shrink: 0;
}

#left-pane .pane-title {
  color: #444;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 10px;
  padding-bottom: 4px;
  border-bottom: 1px solid #2a2a2a;
}

/* Heatmap styles */
#heatmap-container {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
#heatmap-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  grid-template-rows: repeat(6, 1fr);
  gap: 2px;
  border: 1px solid #2a2a2a;
  padding: 2px;
}
.heatmap-cell {
  width: 100%;
  padding-top: 100%; /* Aspect ratio 1:1 */
  position: relative;
  background: #222; /* default for NO_DATA */
  border: 1px solid #161616;
}
.heatmap-cell[data-state="SATISFIED"] { background-color: #3a5a3a; }
.heatmap-cell[data-state="GAP"] { background-color: #8a3a3a; }
.heatmap-cell[data-state="NA"] { background-color: #333; }
.heatmap-cell[data-state="NO_DATA"] { background-color: #222; }

/* Confidence styles */
.heatmap-cell[data-confidence="ATTESTED"] { border-style: solid; }
.heatmap-cell[data-confidence="ANCHORED"] { border-style: dashed; }
.heatmap-cell[data-confidence="EXTRAPOLATED"] { border-style: dotted; }
.heatmap-cell { border-color: #555; }
.heatmap-cell[data-state="SATISFIED"] { border-color: #8de88d; }


#heatmap-axes {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: #444;
    padding: 0 4px;
}

#heatmap-lenses {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 9px;
    color: #444;
    text-align: right;
    padding-right: 4px;
}

#heatmap-wrapper {
    display: flex;
}

/* Centre pane — Artie stub */
#centre-pane {
  width: 260px;
  background: #161616;
  border-right: 1px solid #2a2a2a;
  padding: 12px 8px;
  font-size: 12px;
  color: #555;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
}

/* Right pane — the workbench */
#right-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #1e1e1e;
  overflow: hidden;
}

/* ── Component toolbar ── */
#comp-toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: #181818;
  border-bottom: 1px solid #2a2a2a;
  flex-shrink: 0;
  flex-wrap: wrap;
}

#comp-toolbar.collapsed {
  display: none;
}

#instructional-note {
  font-size: 11px;
  color: #666;
  padding: 6px 16px;
  background: #181818;
  border-bottom: 1px solid #2a2a2a;
}

#instructional-note a {
  color: #8de88d;
  text-decoration: none;
}

#comp-toolbar label {
  font-size: 11px;
  color: #666;
  margin-right: 4px;
}

.comp-btn {
  padding: 4px 10px;
  font-size: 11px;
  font-family: inherit;
  background: #2a2a2a;
  color: #999;
  border: 1px solid #333;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
}

.comp-btn:hover { background: #333; color: #ccc; }

.comp-btn.active {
  background: #3a5a3a;
  color: #8de88d;
  border-color: #4a7a4a;
}

/* ── Script surface ── */
#script-surface {
  flex: 1;
  overflow-y: auto;
  padding: 32px 48px 64px;
}

/* each component block */
.comp-block {
  display: flex;
  align-items: flex-start;
  margin-bottom: 6px;
  gap: 0;
}

/* gutter label */
.comp-gutter {
  width: 120px;
  flex-shrink: 0;
  font-size: 10px;
  color: #444;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding-top: 4px;
  text-align: right;
  padding-right: 14px;
  user-select: none;
}

.comp-block.focused .comp-gutter {
  color: #5a8a5a;
}

/* the contenteditable line */
.comp-input {
  flex: 1;
  min-height: 24px;
  outline: none;
  border: none;
  background: transparent;
  color: #ddd;
  font-family: 'Courier New', Courier, monospace;
  font-size: 15px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  caret-color: #8de88d;
  padding: 2px 0;
  border-bottom: 1px solid transparent;
  transition: border-color 0.15s;
}

.comp-input:focus {
  border-bottom-color: #3a5a3a;
}

/* Fountain-style formatting per type */
.comp-block[data-type="SCENE_HEADING"] .comp-input {
  text-transform: uppercase;
  font-weight: bold;
  color: #fff;
  margin-top: 16px;
}
.comp-block[data-type="CHARACTER"] .comp-input {
  text-transform: uppercase;
  padding-left: 140px;
  color: #ddd;
  margin-top: 12px;
}
.comp-block[data-type="DIALOGUE"] .comp-input {
  padding-left: 60px;
  padding-right: 60px;
  color: #ccc;
}
.comp-block[data-type="PARENTHETICAL"] .comp-input {
  padding-left: 100px;
  padding-right: 100px;
  color: #999;
  font-style: italic;
}
.comp-block[data-type="TRANSITION"] .comp-input {
  text-transform: uppercase;
  text-align: right;
  color: #bbb;
  margin-top: 12px;
}
.comp-block[data-type="NOTE"] .comp-input {
  color: #666;
  font-style: italic;
  border-bottom-color: #333;
}
.comp-block[data-type="ACTION"] .comp-input {
  color: #ddd;
}

/* ── Add-component button ── */
#add-comp-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px 8px 136px;
  border-top: 1px solid #2a2a2a;
  flex-shrink: 0;
}

#add-comp-bar button {
  padding: 5px 14px;
  font-size: 12px;
  font-family: inherit;
  background: #252525;
  color: #777;
  border: 1px solid #333;
  border-radius: 3px;
  cursor: pointer;
}
#add-comp-bar button:hover { background: #2e2e2e; color: #aaa; }

#btn-submit {
  margin-left: auto;
  background: #3a5a3a;
  color: #8de88d;
  border-color: #4a7a4a;
}
#btn-submit:hover {
  background: #405f40;
}

/* ── Init screen ── */
#init-screen {
  position: fixed;
  inset: 0;
  background: #1a1a1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 100;
}

#init-screen h2 {
  font-size: 16px;
  font-weight: normal;
  color: #aaa;
}

.init-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 360px;
}

.init-field label {
  font-size: 12px;
  color: #666;
}

.init-field input {
  background: #222;
  border: 1px solid #333;
  border-radius: 3px;
  color: #ddd;
  font-family: inherit;
  font-size: 14px;
  padding: 8px 10px;
  outline: none;
}
.init-field input:focus { border-color: #4a7a4a; }

#init-screen button {
  padding: 8px 24px;
  background: #3a5a3a;
  color: #8de88d;
  border: 1px solid #4a7a4a;
  border-radius: 3px;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
}
#init-screen button:hover { background: #405f40; }

.init-hint {
  font-size: 11px;
  color: #444;
  max-width: 360px;
  text-align: center;
  line-height: 1.5;
}

.beacon-note {
  background: #252525;
  border: 1px solid #333;
  border-radius: 4px;
  padding: 10px;
  margin-top: 8px;
  font-size: 12px;
  line-height: 1.5;
  color: #aaa;
  white-space: pre-wrap;
}

.artie-response {
  background: #252525;
  border: 1px solid #333;
  border-radius: 4px;
  padding: 10px;
  margin-top: 8px;
  font-size: 12px;
  line-height: 1.5;
  color: #aaa;
  white-space: pre-wrap;
}

#deliberation-container {
    margin-top: 12px;
    border: 1px solid #333;
    border-radius: 4px;
    background: #252525;
    font-size: 11px;
}

#deliberation-header {
    padding: 6px 10px;
    background: #2c2c2c;
    cursor: pointer;
    user-select: none;
    color: #777;
    font-weight: bold;
    letter-spacing: 0.05em;
}

#deliberation-header:hover {
    background: #333;
}

#deliberation-trace {
    padding: 10px;
    white-space: pre;
    line-height: 1.6;
    color: #999;
    display: none; /* Collapsed by default */
}

.trace-axis {
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #333;
}
.trace-axis:last-child { border-bottom: none; margin-bottom: 0; }

.trace-pole {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
}

.trace-pole-name {
    color: #bbb;
    width: 100px;
}

.trace-pole-strength {
    color: #8de88d;
    font-weight: bold;
}

.trace-synthesis {
    margin-top: 12px;
    padding-top: 8px;
    border-top: 1px dashed #444;
    color: #ccc;
}

.trace-synthesis-action {
    font-weight: bold;
    color: #8de88d;
}
</style>
</head>
<body>

<!-- ── Init screen: enter or generate scene/take IDs ── -->
<div id="init-screen">
  <h2>Script Writer Pro — Workbench</h2>
  <div class="init-field">
    <label>Project ID (UUID)</label>
    <input type="text" id="input-project-id" placeholder="leave blank to auto-generate">
  </div>
  <div class="init-field">
    <label>Scene ID (UUID)</label>
    <input type="text" id="input-scene-id" placeholder="leave blank to auto-generate">
  </div>
  <div class="init-field">
    <label>Take ID (UUID — leave blank to create a new take)</label>
    <input type="text" id="input-take-id" placeholder="leave blank to create a new take">
  </div>
  <button id="btn-open">Open Workbench</button>
  <p class="init-hint">
    This surface is the writer's workbench only.<br>
    Nothing generated ever appears here.
  </p>
</div>

<!-- ── Main layout ── -->
<div id="topbar">
  <h1>SCRIPT WRITER PRO</h1>
  <span id="scene-label">—</span>
  <span id="status-msg">ready</span>
</div>

<div id="workspace">
  <!-- Left: scene navigator stub -->
  <div id="left-pane">
    <div class="pane-title">Navigator</div>
    <span style="color:#333">(Task 29+)</span>
    <div id="heatmap-container">
        <div class="pane-title">Coverage Heatmap</div>
        <div id="heatmap-wrapper">
            <div id="heatmap-lenses"></div>
            <div style="flex: 1;">
                <div id="heatmap-grid"></div>
                <div id="heatmap-axes"></div>
            </div>
        </div>
    </div>
  </div>

  <!-- Centre: Artie stub -->
  <div id="centre-pane">
    <div class="pane-title">Artie</div>
    <span id="centre-pane-placeholder" style="color:#333">(Task 29+)</span>
  </div>

  <!-- Right: the workbench -->
  <div id="right-pane">
    <div id="comp-toolbar">
      <label>Component:</label>
      <!-- Seven types per docs/14_editor.md §2 -->
      <button class="comp-btn active" data-type="ACTION">Action</button>
      <button class="comp-btn" data-type="SCENE_HEADING">Scene Heading</button>
      <button class="comp-btn" data-type="CHARACTER">Character</button>
      <button class="comp-btn" data-type="DIALOGUE">Dialogue</button>
      <button class="comp-btn" data-type="PARENTHETICAL">Parenthetical</button>
      <button class="comp-btn" data-type="TRANSITION">Transition</button>
      <button class="comp-btn" data-type="NOTE">Note</button>
    </div>

    <div id="script-surface"></div>

    <div id="add-comp-bar">
      <button id="btn-add-comp">+ Add Component</button>
      <button id="btn-export">Export Fountain</button>
      <button id="btn-submit">Submit Scene</button>
       <button id="test-deliberation-btn">Test Deliberation UI</button>
    </div>
  </div>
</div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// Constants
// ---------------------------------------------------------------------------
const SAVE_IDLE_MS = 2000;
const SAVE_CHAR_THRESHOLD = 200;
const INACTIVITY_TIMEOUT_MS = 10 * 60 * 1000; // 10 minutes

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let projectId = null;
let sceneId = null;
let takeId = null;
let currentType = "ACTION";

// component_id → { el, type, content }
const components = new Map();

// Ordered list of component_ids (sequence_order = index + 1)
const order = [];

// Autosave state
const dirtyComponents = new Set();

// Provenance state
const keystrokeBatch = {
  timer: null,
  startTime: null,
  charDelta: 0,
  componentId: null,
};
let lastKnownCopy = "";
const chainHashes = new Map(); // component_id -> hash

// Inactivity and Return Beacon state
let inactivityTimer = null;
let isAbsent = false;

// ---------------------------------------------------------------------------
// Deliberation Trace
// ---------------------------------------------------------------------------

// NOTE: This function is the placeholder for the missing communication link.
// It is assumed that the response from artie.invoke() is received somehow
// and passed to this function.
document.getElementById("test-deliberation-btn").addEventListener("click", () => {
    const mockResponse = {
        "response_text": "I see a gap in the structure here. The protagonist's goal isn't active enough. Let's press on that.",
        "deliberation_trace": {
            "axes": ["A1"],
            "poles": [
                {
                    "axis": "A1",
                    "poles": [
                        { "pole": "EXPANSION", "position": "hold it back", "reason": "momentum matters more", "strength": 2 },
                        { "pole": "RESTRICTION", "position": "raise it now", "reason": "weight-5 gap", "strength": 4 }
                    ]
                }
            ],
            "synthesis": {
                "action": "RAISE_FINDING",
                "target": "X06.Y2",
                "hold": ["X03.Y1"],
                "register": "DIRECT",
                "rationale": "Restriction pole is stronger and the finding is critical."
            }
        }
    };
    handleArtieResponse(mockResponse);
});

function handleArtieResponse(response) {
    if (!response) return;

    const centrePane = document.getElementById("centre-pane");
    
    // Clear placeholder
    const placeholder = document.getElementById("centre-pane-placeholder");
    if (placeholder) placeholder.remove();

    // Display Artie's response
    if (response.response_text) {
        const responseEl = document.createElement("div");
        responseEl.className = "artie-response";
        responseEl.textContent = response.response_text;
        centrePane.appendChild(responseEl);
    }

    // Display deliberation trace
    if (response.deliberation_trace) {
        renderDeliberationTrace(response.deliberation_trace);
    }
}

function renderDeliberationTrace(trace) {
    const centrePane = document.getElementById("centre-pane");

    const container = document.createElement("div");
    container.id = "deliberation-container";

    const header = document.createElement("div");
    header.id = "deliberation-header";
    header.textContent = "▸ Deliberation Trace";
    
    const traceEl = document.createElement("div");
    traceEl.id = "deliberation-trace";

    // Render Axes and Poles
    trace.poles.forEach(axisData => {
        const axisEl = document.createElement("div");
        axisEl.className = "trace-axis";
        const axisName = document.createElement("strong");
        axisName.textContent = `${axisData.axis}`;
        axisEl.appendChild(axisName);

        axisData.poles.forEach(pole => {
            const poleEl = document.createElement("div");
            poleEl.className = "trace-pole";
            
            const name = document.createElement("span");
            name.className = "trace-pole-name";
            name.textContent = pole.pole;

            const position = document.createElement("span");
            position.textContent = `(${pole.position})`;

            const strength = document.createElement("span");
            strength.className = "trace-pole-strength";
            strength.textContent = `[${pole.strength}]`;

            poleEl.append(name, position, strength);
            axisEl.appendChild(poleEl);
        });
        traceEl.appendChild(axisEl);
    });

    // Render Synthesis
    const synthesis = trace.synthesis;
    if (synthesis) {
        const synthesisEl = document.createElement("div");
        synthesisEl.className = "trace-synthesis";
        synthesisEl.innerHTML = `
            <strong>Synthesis:</strong> <span class="trace-synthesis-action">${synthesis.action}</span><br>
            <strong>Target:</strong> ${synthesis.target || 'none'}<br>
            <strong>Hold:</strong> ${synthesis.hold && synthesis.hold.length > 0 ? synthesis.hold.join(', ') : 'none'}<br>
            <strong>Register:</strong> ${synthesis.register}<br>
            <strong>Rationale:</strong> <em>${synthesis.rationale}</em>
        `;
        traceEl.appendChild(synthesisEl);
    }

    container.appendChild(header);
    container.appendChild(traceEl);
    centrePane.appendChild(container);

    // Toggle visibility
    header.addEventListener("click", () => {
        const isHidden = traceEl.style.display === "none";
        traceEl.style.display = isHidden ? "block" : "none";
        header.textContent = isHidden ? "▾ Deliberation Trace" : "▸ Deliberation Trace";
    });
}


// ---------------------------------------------------------------------------
// Heatmap
// ---------------------------------------------------------------------------
async function loadHeatmap() {
    if (!projectId) return;
    setStatus("loading heatmap…");
    try {
        const res = await fetch(`/project/${projectId}/heatmap`);
        if (!res.ok) {
            setStatus("heatmap error");
            return;
        }
        const data = await res.json();
        renderHeatmap(data);
        setStatus("heatmap loaded.");
    } catch (e) {
        setStatus(`heatmap error: ${e.message}`);
    }
}

function renderHeatmap(data) {
    const grid = document.getElementById("heatmap-grid");
    const axes = document.getElementById("heatmap-axes");
    const lenses = document.getElementById("heatmap-lenses");
    grid.innerHTML = "";
    axes.innerHTML = "";
    lenses.innerHTML = "";

    const POSITIONS = Array.from({length: 12}, (_, i) => `X${String(i + 1).padStart(2, '0')}`);
    const LENSES = ["Y1", "Y2", "Y3", "Y4", "Y5", "Y6"];
    const LENS_NAMES = ["Structure", "Conflict", "Character", "Theme", "Dialogue", "Visual"];

    // Create a map for quick lookup
    const cellData = new Map();
    data.forEach(d => cellData.set(`${d.position}-${d.lens}`, d));

    // Populate grid
    LENSES.forEach(lensCode => {
        POSITIONS.forEach(posCode => {
            const cellId = `${posCode}-${lensCode}`;
            const cellInfo = cellData.get(cellId) || { coverage_state: 'NO_DATA', display_confidence: 'EXTRAPOLATED' };
            const cell = document.createElement("div");
            cell.className = "heatmap-cell";
            cell.dataset.state = cellInfo.coverage_state;
            cell.dataset.confidence = cellInfo.display_confidence;
            cell.title = `${cellId}: ${cellInfo.coverage_state} (${cellInfo.display_confidence})`;
            grid.appendChild(cell);
        });
    });
    
    // Populate axes
    POSITIONS.forEach(posCode => {
        const label = document.createElement("span");
        label.textContent = posCode.substring(1);
        axes.appendChild(label);
    });

    LENS_NAMES.forEach(lensName => {
        const label = document.createElement("div");
        label.textContent = lensName;
        lenses.appendChild(label);
    });
}


// ---------------------------------------------------------------------------
// Return Beacon
// ---------------------------------------------------------------------------
function displayBeacon(noteText) {
  const centrePane = document.getElementById("centre-pane");
  const beaconNote = document.createElement("div");
  beaconNote.className = "beacon-note";
  beaconNote.textContent = noteText;
  
  // Clear placeholder and add note
  const placeholder = centrePane.querySelector("span");
  if (placeholder) placeholder.remove();
  centrePane.appendChild(beaconNote);
}

async function triggerReturnBeacon() {
  if (!sceneId || !takeId) return;
  
  setStatus("welcome back…");
  try {
    const res = await fetch("/beacon/trigger", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        scene_id: sceneId,
        take_id: takeId,
        active_component_type: currentType,
      }),
    });

    if (res.ok) {
      const beacon = await res.json();
      displayBeacon(beacon.note);
      setStatus("beacon received.");
    } else {
       const err = await res.json();
       setStatus(`beacon error: ${err.error || res.status}`);
    }
  } catch (e) {
    setStatus(`beacon error: ${e.message}`);
  }
}

function resetInactivityTimer() {
  if (isAbsent) {
    // User has returned
    isAbsent = false;
    triggerReturnBeacon();
  }

  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    isAbsent = true;
    console.log("User is now considered absent.");
  }, INACTIVITY_TIMEOUT_MS);
}


// ---------------------------------------------------------------------------
// Save & Submit
// ---------------------------------------------------------------------------
async function saveComponent(cid) {
  const comp = components.get(cid);
  if (!comp || comp.tmpId) return; // Don't save temp components

  setStatus("saving…");
  try {
    const res = await fetch(`/components/${cid}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        content: comp.input.textContent,
        comp_type: comp.type,
      }),
    });
    if (!res.ok) {
      const err = await res.json();
      setStatus(`save error: ${err.error || res.status}`);
      return false;
    }
    setStatus("saved.");
    return true;
  } catch (e) {
    setStatus(`save error: ${e.message}`);
    return false;
  }
}

async function saveDirtyComponents() {
  if (dirtyComponents.size === 0) return;
  
  const dirtyArr = Array.from(dirtyComponents);
  // Do them in parallel
  const results = await Promise.all(dirtyArr.map(cid => saveComponent(cid)));

  // Clear only the ones that saved successfully
  results.forEach((success, i) => {
    if (success) {
      dirtyComponents.delete(dirtyArr[i]);
    }
  });
}

document.getElementById("btn-submit").addEventListener("click", async () => {
  resetInactivityTimer();
  if (!takeId) return;

  // Save any lingering changes first
  await saveDirtyComponents();
  if (dirtyComponents.size > 0) {
    setStatus("save error, cannot submit.");
    return;
  }

  setStatus("submitting…");
  try {
    const res = await fetch(`/takes/${takeId}/submit`, { method: "POST" });
    if (!res.ok) {
      const err = await res.json();
      setStatus(`submit error: ${err.error || res.status}`);
    } else {
      const result = await res.json();
      setStatus(`Submitted. Diagnosis ID: ${result.diagnosis_id.slice(0,8)}…`);
      document.getElementById("btn-submit").disabled = true;
      // Refresh heatmap after submit
      loadHeatmap();
    }
  } catch (e) {
    setStatus(`submit error: ${e.message}`);
  }
});

// ---------------------------------------------------------------------------
// Provenance Capture (docs/09_provenance_ledger.md §5, §6)
// ---------------------------------------------------------------------------

// --- Hashing ---
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', text2buf(str));
  return buf2hex(buf);
}
function buf2hex(buffer) {
  return [...new Uint8Array(buffer)]
      .map(x => x.toString(16).padStart(2, '0'))
      .join('');
}
function text2buf(str) {
  return new TextEncoder().encode(str);
}

// --- Event sending ---
async function sendProvenanceEvent(eventType, payload) {
  if (!sceneId) return;
  try {
    const res = await fetch("/events", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        event_type: eventType,
        scene_id: sceneId,
        payload: payload,
      }),
    });
    if (!res.ok) {
      const err = await res.json();
      setStatus(`event error: ${err.error || res.status}`);
    } else {
      // Don't show status for keystrokes, it's too noisy
      if (eventType !== "KEYSTROKE_BATCH") {
        setStatus(`${eventType.toLowerCase().replace(/_/g, " ")} sent`);
      }
    }
  } catch (e) {
    setStatus(`event error: ${e.message}`);
  }
}

async function closeKeystrokeBatch(force = false) {
  if (!keystrokeBatch.startTime || !keystrokeBatch.componentId) return;

  clearTimeout(keystrokeBatch.timer);
  keystrokeBatch.timer = null;

  const cid = keystrokeBatch.componentId;
  const comp = components.get(cid);
  if (!comp) return;

  const content = comp.input.textContent;
  const contentHash = await sha256(content);
  const prevChainHash = chainHashes.get(cid) || await sha256(cid);
  const newChainHash = await sha256(prevChainHash + contentHash);

  const payload = {
    component_id: cid,
    ts_start_micros: keystrokeBatch.startTime,
    ts_end_micros: Date.now() * 1000,
    char_delta: keystrokeBatch.charDelta,
    chain_hash: newChainHash,
  };

  // Provenance and autosave happen together
  await Promise.all([
      sendProvenanceEvent("KEYSTROKE_BATCH", payload),
      saveDirtyComponents()
  ]);

  chainHashes.set(cid, newChainHash);
  keystrokeBatch.startTime = null;
  keystrokeBatch.charDelta = 0;
  keystrokeBatch.componentId = null;
}

function handleKeystroke(e) {
  resetInactivityTimer();
  const input = e.target;
  const cid = input.dataset.componentId;
  if (!cid || cid.startsWith("tmp-")) return;
  
  dirtyComponents.add(cid);

  // Different component, close previous batch
  if (keystrokeBatch.componentId && keystrokeBatch.componentId !== cid) {
    closeKeystrokeBatch(true);
  }

  if (!keystrokeBatch.startTime) {
    keystrokeBatch.startTime = Date.now() * 1000;
    keystrokeBatch.componentId = cid;
  }
  
  // This is an approximation. A more accurate char_delta would analyze
  // the specific change, but this matches the old `charsSinceLastSave`.
  keystrokeBatch.charDelta += 1;

  clearTimeout(keystrokeBatch.timer);
  keystrokeBatch.timer = setTimeout(() => closeKeystrokeBatch(), SAVE_IDLE_MS);

  if (keystrokeBatch.charDelta >= SAVE_CHAR_THRESHOLD) {
    closeKeystrokeBatch(true);
  }
}

function handleCopy(e) {
    const selection = document.getSelection();
    lastKnownCopy = selection.toString();
}

function handlePaste(e) {
    resetInactivityTimer();
    e.preventDefault();
    const text = e.clipboardData.getData("text/plain");
    document.execCommand("insertText", false, text);

    const cid = e.target.dataset.componentId;
    if (!cid || cid.startsWith("tmp-")) return;

    dirtyComponents.add(cid);
    
    // Close any open keystroke batch before processing paste
    closeKeystrokeBatch(true);

    const origin = (text === lastKnownCopy) ? "INTERNAL" : "UNKNOWN";
    
    const payload = {
        origin: origin,
        char_count: text.length,
        target_component_id: cid,
    };
    sendProvenanceEvent("PASTE", payload);
}


// ---------------------------------------------------------------------------
// Init screen
// ---------------------------------------------------------------------------
document.getElementById("btn-open").addEventListener("click", async () => {
  const rawProject = document.getElementById("input-project-id").value.trim();
  const rawScene = document.getElementById("input-scene-id").value.trim();
  const rawTake  = document.getElementById("input-take-id").value.trim();

  projectId = rawProject || crypto.randomUUID();
  sceneId = rawScene || crypto.randomUUID();

  // We need to open a session with the project_id to associate events correctly.
  await fetch("/session/open", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ project_id: projectId, slug_line: `Scene: ${sceneId}` }),
  });


  if (rawTake) {
    takeId = rawTake;
    // Load existing components
    setStatus("loading…");
    await loadComponents();
  } else {
    // Create a new take for this scene
    setStatus("creating take…");
    const res = await fetch(`/scene/${sceneId}/takes`, { method: "POST" });
    if (!res.ok) {
      setStatus(`error creating take: ${res.status}`);
      return;
    }
    const data = await res.json();
    takeId = data.take_id;
    setStatus(`take ${data.take_number} created`);
  }
  
  // Now that we have a project, load the heatmap
  await loadHeatmap();

  document.getElementById("scene-label").textContent =
    `proj ${projectId.slice(0,8)}… / scene ${sceneId.slice(0,8)}… / take ${takeId.slice(0,8)}…`;
  document.getElementById("init-screen").style.display = "none";
  resetInactivityTimer();
});

// ---------------------------------------------------------------------------
// Component type toolbar
// ---------------------------------------------------------------------------
document.querySelectorAll(".comp-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentType = btn.dataset.type;
    setActiveTypeBtn(currentType);
    resetInactivityTimer();
  });
});

function setActiveTypeBtn(type) {
  document.querySelectorAll(".comp-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.type === type);
  });
}

// ---------------------------------------------------------------------------
// Add component
// ---------------------------------------------------------------------------
document.getElementById("btn-add-comp").addEventListener("click", () => {
  resetInactivityTimer();
  const lastBlock = document.querySelector("#script-surface .comp-block:last-child");
  addComponentToSurface({ comp_type: currentType, content: "", component_id: null }, lastBlock);
});

async function addComponentToSurface({ comp_type, content, component_id }, afterBlock = null) {
  const surface = document.getElementById("script-surface");

  const block = document.createElement("div");
  block.className = "comp-block";
  block.dataset.type = comp_type;

  const gutter = document.createElement("div");
  gutter.className = "comp-gutter";
  gutter.textContent = labelFor(comp_type);

  const input = document.createElement("div");
  input.className = "comp-input";
  input.contentEditable = "true";
  input.spellcheck = true;
  
  input.addEventListener("paste", handlePaste);
  input.addEventListener("copy", handleCopy);

  if (content) input.textContent = content;

  block.appendChild(gutter);
  block.appendChild(input);
  
  // --- Insert into DOM ---
  let afterId = afterBlock ? afterBlock.dataset.componentId : null;
  let insertionIndex = order.length;
  if (afterId) {
      const idx = order.indexOf(afterId);
      if (idx !== -1) {
          insertionIndex = idx + 1;
      }
  }
  
  if (insertionIndex < order.length) {
      const beforeNode = components.get(order[insertionIndex]).block;
      surface.insertBefore(block, beforeNode);
  } else {
      surface.appendChild(block);
  }

  // --- Create or update record ---
  let newId = component_id;
  if (!newId) {
    // New unsaved component. Save it immediately to get a real ID.
    setStatus("creating component…");
    const sequence_order = insertionIndex + 1;
    const res = await fetch(`/takes/${takeId}/components`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        comp_type,
        content: "",
        sequence_order
      }),
    });
    if (!res.ok) {
        setStatus('error creating component');
        block.remove();
        return null;
    }
    const data = await res.json();
    newId = data.component_id;
    setStatus('component created');
  }

  // --- Finalize state ---
  block.dataset.componentId = newId;
  input.dataset.componentId = newId;
  
  order.splice(insertionIndex, 0, newId);
  
  components.set(newId, { block, input, type: comp_type, content: content || "" });

  // Focus and gutter highlight
  input.addEventListener("focus", () => {
    block.classList.add("focused");
    currentType = comp_type;
    setActiveTypeBtn(comp_type);
  });
  input.addEventListener("blur", () => {
    block.classList.remove("focused");
    closeKeystrokeBatch(true);
  });
  
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const content = input.textContent.trim();
      const currentType = block.dataset.type;
      
      if (content === "") {
        const fallThrough = {
          SCENE_HEADING: "ACTION", ACTION: "SCENE_HEADING", CHARACTER: "ACTION",
          DIALOGUE: "ACTION", PARENTHETICAL: "ACTION", TRANSITION: "ACTION", NOTE: "ACTION"
        };
        changeComponentType(block, fallThrough[currentType]);
      } else {
        const predict = {
          SCENE_HEADING: "ACTION", ACTION: "ACTION", CHARACTER: "DIALOGUE",
          DIALOGUE: "CHARACTER", PARENTHETICAL: "DIALOGUE", TRANSITION: "SCENE_HEADING", NOTE: "ACTION"
        };
        const nextType = predict[currentType] || "ACTION";
        closeKeystrokeBatch(true);
        addComponentToSurface({ comp_type: nextType, content: "", component_id: null }, block);
      }
    } else if (e.key === "Tab") {
      e.preventDefault();
      const cycle = {
        ACTION: "CHARACTER", CHARACTER: "PARENTHETICAL", PARENTHETICAL: "DIALOGUE",
        DIALOGUE: "TRANSITION", TRANSITION: "SCENE_HEADING", SCENE_HEADING: "ACTION", NOTE: "ACTION"
      };
      changeComponentType(block, cycle[block.dataset.type]);
      recordTabPress();
    }
  });

  input.addEventListener("input", (e) => {
    const text = input.textContent;
    const currentType = block.dataset.type;
    let newType = null;
    
    if (/^(INT\.|EXT\.|EST\.|I\/E)/i.test(text.trimStart()) && currentType !== "SCENE_HEADING") {
      newType = "SCENE_HEADING";
    } else if (text.startsWith("(") && currentType !== "PARENTHETICAL") {
      newType = "PARENTHETICAL";
    }

    if (newType) {
      changeComponentType(block, newType);
    }
    
    handleKeystroke(e);
  });

  input.focus();
  return block;
}

function changeComponentType(block, newType) {
  const cid = block.dataset.componentId;
  if (!cid || cid.startsWith("tmp-")) return;

  const comp = components.get(cid);
  comp.type = newType;
  
  block.dataset.type = newType;
  const gutter = block.querySelector(".comp-gutter");
  gutter.textContent = labelFor(newType);
  
  currentType = newType;
  setActiveTypeBtn(newType);

  dirtyComponents.add(cid);
  
  closeKeystrokeBatch(true);
}

function labelFor(type) {
  const labels = {
    SCENE_HEADING: "SCENE HDG",
    ACTION: "ACTION",
    CHARACTER: "CHARACTER",
    DIALOGUE: "DIALOGUE",
    PARENTHETICAL: "PARENT.",
    TRANSITION: "TRANSITION",
    NOTE: "NOTE",
  };
  return labels[type] || type;
}

// ---------------------------------------------------------------------------
// Instructional Mode
// ---------------------------------------------------------------------------
let tabPresses = 0;
const TAB_COLLAPSE_THRESHOLD = 5;
let instructionalCollapsed = false;

function recordTabPress() {
  if (instructionalCollapsed) return;
  tabPresses++;
  if (tabPresses >= TAB_COLLAPSE_THRESHOLD) {
    collapseInstructionalMode();
  }
}

function collapseInstructionalMode() {
  instructionalCollapsed = true;
  const toolbar = document.getElementById("comp-toolbar");
  toolbar.classList.add("collapsed");
  // Show a one-line note
  let note = document.getElementById("instructional-note");
  if (!note) {
    note = document.createElement("div");
    note.id = "instructional-note";
    note.innerHTML = `Mode palette hidden. <a href="#" id="toggle-palette">Show palette</a>`;
    toolbar.parentNode.insertBefore(note, toolbar.nextSibling);
    document.getElementById("toggle-palette").addEventListener("click", (e) => {
      e.preventDefault();
      toolbar.classList.toggle("collapsed");
    });
  }
}

// ---------------------------------------------------------------------------
// Load existing components from the backend
// ---------------------------------------------------------------------------
async function loadComponents() {
  const res = await fetch(`/takes/${takeId}/components`);
  if (!res.ok) { setStatus("error loading components"); return; }
  const data = await res.json();

  // Re-order based on sequence_order, which should already be the case
  // but let's be safe.
  data.sort((a,b) => a.sequence_order - b.sequence_order);

  let lastBlock = null;
  for (const c of data) {
    lastBlock = await addComponentToSurface({
      comp_type: c.comp_type,
      content: c.content,
      component_id: c.component_id,
    }, lastBlock);
  }
  setStatus(`loaded ${data.length} component(s)`);
}

// ---------------------------------------------------------------------------
// Export Fountain
// ---------------------------------------------------------------------------
document.getElementById("btn-export").addEventListener("click", async () => {
  resetInactivityTimer();
  if (!takeId) return;
  const res = await fetch(`/takes/${takeId}/fountain`);
  if (!res.ok) { setStatus("export error"); return; }
  const text = await res.text();
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `take-${takeId.slice(0,8)}.fountain`;
  a.click();
  URL.revokeObjectURL(url);
  setStatus("exported");
});

// ---------------------------------------------------------------------------
// Utility
// ---------------------------------------------------------------------------
function setStatus(msg) {
  document.getElementById("status-msg").textContent = msg;
}
